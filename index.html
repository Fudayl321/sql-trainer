<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f1a">
  <title>SQL Skill Trainer</title>
  <link rel="manifest" href="./manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/alasql@4.2.3/dist/alasql.min.js"></script>
  <style>
    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --surface2: #16213e;
      --accent: #00d4ff;
      --accent2: #7c3aed;
      --success: #22c55e;
      --error: #ef4444;
      --warning: #f59e0b;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --border: #2d3748;
      --code-bg: #0d1117;
      --code-text: #7ee787;

      /* Glow tokens */
      --glow-cyan:   0 0 12px rgba(0,212,255,0.6),  0 0 24px rgba(0,212,255,0.2);
      --glow-purple: 0 0 12px rgba(124,58,237,0.6),  0 0 24px rgba(124,58,237,0.2);
      --glow-green:  0 0 12px rgba(34,197,94,0.5),   0 0 24px rgba(34,197,94,0.15);
      --glow-red:    0 0 12px rgba(239,68,68,0.5);
      --glow-amber:  0 0 10px rgba(245,158,11,0.5);

      /* Level accent colors */
      --level-1: #00d4ff;
      --level-2: #7c3aed;
      --level-3: #22c55e;
      --level-4: #f59e0b;
      --level-5: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }
    body {
      display: flex;
      flex-direction: column;
      max-width: 640px;
      margin: 0 auto;
      position: relative;
    }

    /* Header */
    #header {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 640px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
    }
    #header .app-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.5px;
    }
    #header .badges {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      transition: box-shadow 0.3s;
    }
    .badge.lvl-1 { color: var(--level-1); border-color: rgba(0,212,255,0.4);   background: rgba(0,212,255,0.08);   box-shadow: 0 0 8px rgba(0,212,255,0.25); }
    .badge.lvl-2 { color: var(--level-2); border-color: rgba(124,58,237,0.4);  background: rgba(124,58,237,0.08);  box-shadow: 0 0 8px rgba(124,58,237,0.25); }
    .badge.lvl-3 { color: var(--level-3); border-color: rgba(34,197,94,0.4);   background: rgba(34,197,94,0.08);   box-shadow: 0 0 8px rgba(34,197,94,0.25); }
    .badge.lvl-4 { color: var(--level-4); border-color: rgba(245,158,11,0.4);  background: rgba(245,158,11,0.08);  box-shadow: 0 0 8px rgba(245,158,11,0.25); }
    .badge.lvl-5 { color: var(--level-5); border-color: rgba(239,68,68,0.4);   background: rgba(239,68,68,0.08);   box-shadow: 0 0 8px rgba(239,68,68,0.25); }
    .streak-glow { box-shadow: var(--glow-amber) !important; color: var(--warning) !important; border-color: rgba(245,158,11,0.5) !important; }
    .badge.level { color: var(--accent2); border-color: var(--accent2); }
    .badge.streak { color: var(--warning); border-color: var(--warning); }

    /* Main content */
    #main {
      margin-top: 57px;
      margin-bottom: 65px;
      overflow-y: auto;
      flex: 1;
      padding: 16px;
    }

    /* Bottom nav */
    #bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 640px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 10px 4px;
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 11px;
      letter-spacing: 0.03em;
      cursor: pointer;
      min-height: 56px;
      transition: color 0.15s, box-shadow 0.25s, transform 0.25s;
    }
    .nav-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .nav-btn.active {
      color: var(--accent);
      text-shadow: 0 0 8px rgba(0,212,255,0.6);
      transform: scale(1.08);
    }

    /* Tabs */
    .tab { display: none; }
    .tab.active { display: block; }

    /* Cards */
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, transparent 60%), var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .pill {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 600;
    }
    .pill.concept { color: var(--accent); border-color: var(--accent); }
    .pill.pass { color: var(--success); border-color: var(--success); }
    .pill.locked { color: var(--text-dim); }

    /* Session meta */
    .session-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      font-size: 13px;
      color: var(--text-dim);
    }
    .session-meta strong { color: var(--text); }

    /* Collapsible */
    .collapsible-btn {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      min-height: 48px;
    }
    .collapsible-btn .icon { margin-right: 6px; }
    .collapsible-btn .chevron { transition: transform 0.2s; font-size: 12px; color: var(--text-dim); }
    .collapsible-btn.open .chevron { transform: rotate(180deg); }
    .collapsible-content {
      display: none;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--text-dim);
      line-height: 1.6;
    }
    .collapsible-content.open { display: block; }

    /* Question card */
    .q-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .q-card.locked { opacity: 0.5; pointer-events: none; }
    .q-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .q-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-dim);
    }
    .q-prompt {
      font-size: 14px;
      color: var(--text);
      margin-bottom: 12px;
      line-height: 1.6;
    }
    textarea {
      width: 100%;
      min-height: 110px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--code-text);
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
      font-size: 16px;
      padding: 12px;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
    }
    textarea:focus { border-color: var(--accent); box-shadow: var(--glow-cyan); }
    textarea.error { border-color: var(--error); }
    textarea.success { border-color: var(--success); }

    .run-btn {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      min-height: 48px;
      background: var(--accent2);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .run-btn:hover { opacity: 0.88; }
    .run-btn:disabled { opacity: 0.4; cursor: default; }

    /* Feedback */
    .feedback {
      margin-top: 10px;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      display: none;
    }
    .feedback.show { display: block; }
    .feedback.pass { background: rgba(34,197,94,0.1); border: 1px solid var(--success); color: var(--success); }
    .feedback.fail { background: rgba(239,68,68,0.1); border: 1px solid var(--error); color: var(--error); }
    .feedback .hint { color: var(--text-dim); margin-top: 6px; }

    /* Result preview table */
    .result-preview {
      margin-top: 10px;
      overflow-x: auto;
      display: none;
    }
    .result-preview.show { display: block; }
    .result-preview table {
      border-collapse: collapse;
      font-size: 12px;
      width: 100%;
    }
    .result-preview th {
      background: var(--surface);
      color: var(--accent);
      padding: 6px 10px;
      text-align: left;
      border: 1px solid var(--border);
      font-weight: 600;
    }
    .result-preview td {
      padding: 5px 10px;
      border: 1px solid var(--border);
      color: var(--text-dim);
      white-space: nowrap;
    }
    .result-preview tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
    .result-preview .more-rows {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 4px;
      text-align: right;
    }

    /* Session complete banner */
    .complete-banner {
      background: linear-gradient(135deg, rgba(34,197,94,0.15), rgba(0,212,255,0.1));
      border: 1px solid var(--success);
      border-radius: 12px;
      padding: 20px 16px;
      text-align: center;
      margin-bottom: 12px;
    }
    .complete-banner h2 { font-size: 20px; margin-bottom: 6px; }
    .complete-banner p { font-size: 14px; color: var(--text-dim); }
    .complete-banner .streak-display {
      font-size: 32px;
      font-weight: 800;
      color: var(--warning);
      margin: 10px 0;
    }

    /* Day Gate */
    .gate-card {
      background: linear-gradient(135deg, rgba(0,212,255,0.08), rgba(99,102,241,0.08));
      border: 1px solid var(--accent2);
      border-radius: 12px;
      padding: 18px 16px;
      margin-bottom: 12px;
    }
    .gate-card.gate-failed {
      background: rgba(239,68,68,0.07);
      border-color: var(--error);
    }
    .gate-card h3 { font-size: 16px; margin: 0 0 4px; }
    .gate-card p { font-size: 14px; color: var(--text-dim); margin: 0 0 14px; }
    .gate-card.gate-failed p { margin: 0; }
    .gate-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }
    .gate-icon { font-size: 26px; line-height: 1; flex-shrink: 0; }
    .gate-q {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-top: 12px;
    }
    .gate-q.gate-q-done { opacity: 0.75; }
    .gate-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .btn-continue { background: var(--accent); color: #000; border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn-skip { background: transparent; border: 1px solid var(--text-dim); color: var(--text-dim); border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; }

    /* Progress tab */
    .xp-bar-wrap {
      display: flex;
      gap: 3px;
      margin: 8px 0 14px;
      height: 10px;
    }
    .xp-segment {
      flex: 1;
      border-radius: 3px;
      background: var(--surface2);
      transition: background 0.3s, box-shadow 0.3s;
    }
    .xp-segment.filled {
      animation: xp-fill 0.5s ease forwards;
    }
    .xp-segment.lvl-1.filled { background: var(--level-1); box-shadow: 0 0 6px rgba(0,212,255,0.5); }
    .xp-segment.lvl-2.filled { background: var(--level-2); box-shadow: 0 0 6px rgba(124,58,237,0.5); }
    .xp-segment.lvl-3.filled { background: var(--level-3); box-shadow: 0 0 6px rgba(34,197,94,0.5); }
    .xp-segment.lvl-4.filled { background: var(--level-4); box-shadow: 0 0 6px rgba(245,158,11,0.5); }
    .xp-segment.lvl-5.filled { background: var(--level-5); box-shadow: 0 0 6px rgba(239,68,68,0.5); }

    .concept-list { list-style: none; }
    .concept-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .concept-item:last-child { border-bottom: none; }
    .concept-check { font-size: 16px; }
    .concept-check.done { color: var(--success); }
    .concept-check.pending { color: var(--text-dim); }
    .concept-level-pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }
    .lvl-1 { background: rgba(124,58,237,0.2); color: #a78bfa; }
    .lvl-2 { background: rgba(0,212,255,0.15); color: var(--accent); }
    .lvl-3 { background: rgba(34,197,94,0.15); color: var(--success); }
    .lvl-4 { background: rgba(245,158,11,0.15); color: var(--warning); }
    .lvl-5 { background: rgba(239,68,68,0.15);  color: #f87171; }

    .reset-btn {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      min-height: 48px;
      background: transparent;
      color: var(--error);
      border: 1px solid var(--error);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .reset-btn:hover { background: rgba(239,68,68,0.1); }

    /* Schema tab */
    .schema-table-wrap {
      overflow-x: auto;
      margin-bottom: 6px;
    }
    .schema-table {
      border-collapse: collapse;
      font-size: 12px;
      width: 100%;
    }
    .schema-table th {
      background: var(--surface2);
      color: var(--accent);
      padding: 7px 10px;
      text-align: left;
      border: 1px solid var(--border);
      font-weight: 700;
      white-space: nowrap;
    }
    .schema-table td {
      padding: 6px 10px;
      border: 1px solid var(--border);
      color: var(--text-dim);
      white-space: nowrap;
    }
    .schema-table tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
    .table-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--warning);
      margin: 14px 0 6px;
    }
    .table-name:first-child { margin-top: 0; }

    /* SQL editor overlay */
    .editor-wrap {
      position: relative;
      margin-top: 10px;
    }
    .hl-layer {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
      font-size: 13px;
      line-height: 1.5;
      padding: 12px;
      white-space: pre-wrap;
      word-wrap: break-word;
      border: 1px solid transparent;
      border-radius: 8px;
      background: var(--code-bg);
      margin: 0;
      overflow: hidden;
      color: var(--code-text);
    }
    .editor-wrap textarea {
      position: relative;
      background: transparent;
      color: transparent;
      caret-color: var(--code-text);
      z-index: 1;
      margin-top: 0;
      resize: none;
    }
    .editor-wrap textarea::placeholder { color: var(--text-dim); opacity: 1; }
    .editor-wrap textarea:focus { border-color: var(--accent); }
    .editor-wrap textarea:focus + .hl-layer,
    .editor-wrap textarea.error + .hl-layer { border-color: transparent; }
    .kw  { color: #79b8ff; }
    .fn  { color: #b392f0; }
    .str { color: #f6c90e; }
    .num { color: #79dcaa; }

    /* Wiki */
    .ref-code {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
      font-size: 12px;
      color: var(--code-text);
      overflow-x: auto;
      white-space: pre;
      margin: 0 0 8px;
      line-height: 1.6;
    }
    .ref-tip {
      background: rgba(0,212,255,0.06);
      border: 1px solid rgba(0,212,255,0.18);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.6;
    }
    .ref-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 10px 0 4px;
    }
    .ref-level-header {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 18px 0 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .ref-level-header:first-child { margin-top: 0; }
    .wiki-search {
      width: 100%;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      margin-bottom: 14px;
    }
    .wiki-search:focus { border-color: var(--accent); }
    .ref-card { margin-bottom: 6px; }
    .ref-card.hidden { display: none; }
    .ref-card-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      padding: 4px 0 2px;
    }
    .ref-card-trigger:hover .ref-card-label { color: var(--accent); }
    .ref-card-chevron {
      font-size: 11px;
      color: var(--text-dim);
      transition: transform 0.2s;
      flex-shrink: 0;
      margin-left: 8px;
    }
    .ref-card.open .ref-card-chevron { transform: rotate(180deg); }
    .ref-card-body {
      display: none;
      padding-top: 8px;
    }
    .ref-card.open .ref-card-body { display: block; }

    /* Misc */
    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
    }
    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 14px;
    }
    .stat-val { font-weight: 700; color: var(--text); }

    /* PWA install banner */
    #pwa-banner {
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      color: var(--text);
      position: relative;
      z-index: 99;
    }
    #pwa-banner button {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    #pwa-banner .pwa-dismiss {
      background: none;
      color: var(--text-dim);
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    /* Offline indicator */
    #offline-pill {
      background: rgba(245,158,11,0.15);
      border: 1px solid rgba(245,158,11,0.4);
      color: var(--warning);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 8px;
    }

    /* ── Animation keyframes ─────────────────────────────── */
    @keyframes correct-pulse {
      0%   { box-shadow: var(--glow-green); }
      100% { box-shadow: none; }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-6px); }
      60%       { transform: translateX(6px); }
    }
    @keyframes xp-fill {
      from { opacity: 0; transform: scaleX(0.5); }
      to   { opacity: 1; transform: scaleX(1); }
    }
    @keyframes slide-in-right {
      from { transform: translateX(110%); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }
    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes overlay-flash {
      0%   { opacity: 0; }
      15%  { opacity: 1; }
      80%  { opacity: 1; }
      100% { opacity: 0; }
    }

const TIPS = {
  select_basics: "SELECT specifies which columns to return. Use * for all columns, or name specific columns to control the output. Column order in the result follows your SELECT list.",
  where_filter: "WHERE filters rows before they are returned. The condition must evaluate to TRUE for a row to be included. String values use single quotes: WHERE status = 'active'.",
  where_operators: "AND requires BOTH conditions to be true. OR requires EITHER. AND has higher precedence than OR — use parentheses when mixing them to make intent explicit.",
  order_by: "ORDER BY sorts results. DESC = largest/latest first, ASC = smallest/earliest (the default). Without ORDER BY, row order is unpredictable — never rely on it.",
  distinct: "DISTINCT removes duplicate values. It applies to the full row — if you SELECT two columns, DISTINCT removes rows where BOTH columns are identical.",
  limit: "LIMIT caps the number of rows returned. Always pair it with ORDER BY — without ORDER BY, LIMIT picks rows in an arbitrary order that may change between runs.",
  aggregate_functions: "COUNT(*) counts all rows. COUNT(column) skips NULLs. SUM, AVG, MIN, MAX work on numeric columns. Aggregate functions collapse many rows into one value.",
  group_by: "GROUP BY collapses rows with the same value into one group. Every column in SELECT must either appear in GROUP BY or be inside an aggregate function like COUNT or SUM.",
  having: "HAVING filters after grouping — like WHERE but for aggregate results. WHERE runs before GROUP BY and can't see COUNT or SUM. HAVING runs after and can.",
  case_when: "CASE WHEN condition THEN value WHEN condition2 THEN value2 ELSE default END — returns a value per row based on conditions. The ELSE is optional but good practice. Always close with END.",
  inner_join: "JOIN (or INNER JOIN) returns only rows where the join condition matches in BOTH tables. Rows with no match are dropped from the result.",
  left_join: "LEFT JOIN keeps ALL rows from the left table. Where there is no match in the right table, right-side columns are NULL. Use COUNT(right.column) not COUNT(*) to get 0 for no-match rows.",
  subquery: "A subquery is a SELECT inside another SELECT, wrapped in parentheses. It runs first and its result is used by the outer query. Good for thresholds you need to compute on the fly.",
  in_exists: "IN checks if a value matches any value in a list. IN (subquery) checks against a dynamically computed list. Cleaner than writing multiple OR conditions.",
  cte_basics: "A CTE (WITH ... AS) names a subquery at the top of your statement. It runs once, then you reference it by name. CTEs make complex queries readable by breaking them into named steps.",
  row_number: "ROW_NUMBER() OVER (ORDER BY ...) assigns a unique sequential integer to each row. The ORDER BY inside OVER controls the ranking — it does not sort the output. Add an outer ORDER BY to sort results.",
  rank_dense_rank: "RANK() assigns the same rank to ties, then skips numbers (1,1,3). DENSE_RANK() also ties equal rows but never skips (1,1,2). ROW_NUMBER() always gives unique numbers even on ties. Pick based on how you want ties handled.",
  running_total: "SUM(col) OVER (ORDER BY ...) produces a running cumulative sum — each row shows the total of all rows up to and including that point. The ORDER BY inside OVER defines the accumulation order.",
  lag_lead: "LAG(col) OVER (ORDER BY ...) fetches the previous row's value. LEAD(col) fetches the next row's value. Both return NULL at the boundary. Useful for period-over-period comparisons.",
  between: "BETWEEN is inclusive on both ends: WHERE amount BETWEEN 5000 AND 10000 includes 5000 and 10000. It's equivalent to amount >= 5000 AND amount <= 10000.",
  like: "LIKE matches patterns: % matches any sequence of characters, _ matches exactly one character. Case sensitivity depends on the database — wrap in UPPER() to be safe.",
  is_null: "NULL is not a value — it's the absence of one. You cannot compare it with = or !=. Use IS NULL to check for missing values, IS NOT NULL to exclude them.",
  union: "UNION combines results from two SELECT statements and removes duplicates. UNION ALL keeps all rows including duplicates — it's faster when you know there are no duplicates or you want to keep them.",
  string_functions: "UPPER(col) / LOWER(col) change case. LENGTH(col) returns character count. CONCAT(a, b) or a || b joins strings. TRIM(col) removes leading and trailing spaces.",
  self_join: "A self-join joins a table to itself by aliasing it twice. Common for hierarchical data — finding a manager's name when both employees and managers are in the same table.",
  coalesce: "COALESCE(a, b, c) returns the first non-NULL value in the list. Use it to substitute a default when a column might be NULL: COALESCE(discount, 0) gives 0 instead of NULL.",
  multiple_cte: "You can chain multiple CTEs in one WITH clause, separated by commas. Later CTEs can reference earlier ones — this lets you build complex queries step by step with readable named stages.",
  partition_agg: "Adding PARTITION BY to a window aggregate computes the aggregate per group but keeps all rows. Unlike GROUP BY (which collapses rows), PARTITION BY adds a group-level value to every row.",
  aliases: "AS gives a column or table expression a temporary name. Column aliases work in ORDER BY but NOT in WHERE, GROUP BY, or HAVING (they are not computed yet at that stage). Table aliases shorten join syntax: e.name instead of employees.name.",
  wildcards_adv: "% matches any number of characters (including zero). _ matches exactly one character. A leading % forces a full-table scan — anchor patterns at the start when possible. Case sensitivity depends on the database.",
  date_functions: "Group rows by time period using the year or month column. For actual date columns, YEAR(col) / MONTH(col) extract parts. BETWEEN is the cleanest way to filter a date range.",
  right_join: "RIGHT JOIN keeps ALL rows from the right (second) table. It is equivalent to swapping the tables and using LEFT JOIN — most developers prefer LEFT JOIN since it reads more naturally left-to-right.",
  cross_join: "CROSS JOIN returns every row from the left table paired with every row from the right table. Result size = rows_a × rows_b. Always filter or aggregate — an unfiltered CROSS JOIN on large tables is a common performance disaster.",

  {id:'q_ag4', level:2, concept:'aggregate_functions', type:'challenge', ordered:false,
    prompt:'For active loans only: show total amount lent as total, average interest rate as avg_rate, and minimum interest rate as min_rate.',
    solution:"SELECT SUM(amount) AS total, AVG(interest_rate) AS avg_rate, MIN(interest_rate) AS min_rate FROM loans WHERE status = 'active'",
    expected:(function(){
      const al=TABLES.loans.filter(r=>r.status==='active');
      return [{
        total:al.reduce((s,r)=>s+r.amount,0),
        avg_rate:al.reduce((s,r)=>s+r.interest_rate,0)/al.length,
        min_rate:Math.min(...al.map(r=>r.interest_rate))
      }];
    })(),
    hint:"Add WHERE status = 'active' before the aggregates run. SUM, AVG, and MIN all ignore the filtered-out rows."},

  {id:'q_gb4', level:2, concept:'group_by', type:'challenge', ordered:true,
    prompt:'Show each department with its total salary budget as total_salary and employee count as headcount. Order by total_salary descending.',
    solution:'SELECT department, SUM(salary) AS total_salary, COUNT(*) AS headcount FROM employees GROUP BY department ORDER BY total_salary DESC',
    expected:(function(){
      const depts={};
      TABLES.employees.forEach(e=>{
        if(!depts[e.department]) depts[e.department]={total_salary:0,headcount:0};
        depts[e.department].total_salary+=e.salary;
        depts[e.department].headcount++;
      });
      return Object.entries(depts)
        .map(([department,d])=>({department,total_salary:d.total_salary,headcount:d.headcount}))
        .sort((a,b)=>b.total_salary-a.total_salary);
    })(),
    hint:'GROUP BY department, then SUM(salary) AS total_salary and COUNT(*) AS headcount. ORDER BY total_salary DESC at the end.'},

  {id:'q_hv4', level:2, concept:'having', type:'challenge', ordered:true,
    prompt:'Find branches that have more than 2 employees. Show branch name and employee count as emp_count. Order by emp_count descending, then name ascending.',
    solution:'SELECT b.name, COUNT(e.employee_id) AS emp_count FROM branches b JOIN employees e ON b.branch_id = e.branch_id GROUP BY b.name HAVING COUNT(e.employee_id) > 2 ORDER BY emp_count DESC, b.name ASC',
    expected:(function(){
      const counts={};
      TABLES.employees.forEach(e=>{
        const b=TABLES.branches.find(b=>b.branch_id===e.branch_id);
        if(b) counts[b.name]=(counts[b.name]||0)+1;
      });
      return Object.entries(counts)
        .filter(([,c])=>c>2)
        .map(([name,emp_count])=>({name,emp_count}))
        .sort((a,b)=>b.emp_count-a.emp_count||a.name.localeCompare(b.name));
    })(),
    hint:'JOIN branches to employees, GROUP BY branch name, then HAVING COUNT(e.employee_id) > 2 filters after grouping.'},

  {id:'q_cw4', level:2, concept:'case_when', type:'challenge', ordered:true,
    prompt:"Label each customer with a credit_grade: 'Excellent' if credit_score >= 750, 'Good' if >= 700, 'Fair' if >= 650, else 'Poor'. Return name, credit_score, and credit_grade, ordered by credit_score descending.",
    solution:"SELECT name, credit_score, CASE WHEN credit_score >= 750 THEN 'Excellent' WHEN credit_score >= 700 THEN 'Good' WHEN credit_score >= 650 THEN 'Fair' ELSE 'Poor' END AS credit_grade FROM customers ORDER BY credit_score DESC",
    expected:(function(){
      const grade=cs=>cs>=750?'Excellent':cs>=700?'Good':cs>=650?'Fair':'Poor';
      return [...TABLES.customers]
        .sort((a,b)=>b.credit_score-a.credit_score)

    hint:"CASE WHEN evaluates top-down — put the highest threshold first. ELSE catches everything below 650."},

  {id:'q_rn4', level:4, concept:'row_number', type:'challenge', ordered:true,
    prompt:'Show each employee\'s name, department, salary, and their row number within their department ordered by salary descending as dept_rank. Use ROW_NUMBER() OVER (PARTITION BY department ORDER BY salary DESC). Order results by department, then dept_rank.',
    solution:'SELECT name, department, salary, ROW_NUMBER() OVER (PARTITION BY department ORDER BY salary DESC) AS dept_rank FROM employees ORDER BY department, dept_rank',
    expected:(function(){
      const byDept={};
      TABLES.employees.forEach(e=>{
        if(!byDept[e.department]) byDept[e.department]=[];
        byDept[e.department].push(e);
      });
      const result=[];
      Object.keys(byDept).sort().forEach(dept=>{
        [...byDept[dept]].sort((a,b)=>b.salary-a.salary).forEach((e,i)=>{
          result.push({name:e.name,department:e.department,salary:e.salary,dept_rank:i+1});
        });
      });
      return result;
    })(),
    hint:'ROW_NUMBER() OVER (PARTITION BY department ORDER BY salary DESC) — PARTITION BY resets the counter per department.'},

  {id:'q_rd4', level:4, concept:'rank_dense_rank', type:'challenge', ordered:true,
    prompt:'For each transaction, show transaction_id, customer_id, amount, and the transaction\'s rank within that customer\'s transactions by amount descending using DENSE_RANK() as txn_rank. Order by customer_id, txn_rank.',
    solution:'SELECT transaction_id, customer_id, amount, DENSE_RANK() OVER (PARTITION BY customer_id ORDER BY amount DESC) AS txn_rank FROM transactions ORDER BY customer_id, txn_rank',
    expected:(function(){
      const byCust={};
      TABLES.transactions.forEach(t=>{
        if(!byCust[t.customer_id]) byCust[t.customer_id]=[];
        byCust[t.customer_id].push(t);
      });
      const result=[];
      Object.keys(byCust).sort((a,b)=>Number(a)-Number(b)).forEach(cid=>{
        [...byCust[cid]].sort((a,b)=>b.amount-a.amount).forEach((t,i)=>{
          result.push({transaction_id:t.transaction_id,customer_id:t.customer_id,amount:t.amount,txn_rank:i+1});
        });
      });
      return result;
    })(),
    hint:'DENSE_RANK() OVER (PARTITION BY customer_id ORDER BY amount DESC) — ranks reset per customer, no gaps on ties.'},

  {id:'q_rt4', level:4, concept:'running_total', type:'challenge', ordered:true,
    prompt:'Show each payment\'s payment_id, loan_id, amount, and a running_total that resets per loan (running sum of payments within each loan, ordered by payment_id). Order by loan_id, payment_id.',
    solution:'SELECT payment_id, loan_id, amount, SUM(amount) OVER (PARTITION BY loan_id ORDER BY payment_id) AS running_total FROM payments ORDER BY loan_id, payment_id',
    expected:(function(){
      const byLoan={};
      [...TABLES.payments].sort((a,b)=>a.payment_id-b.payment_id).forEach(p=>{
        if(!byLoan[p.loan_id]) byLoan[p.loan_id]=[];
        byLoan[p.loan_id].push(p);
      });
      const result=[];
      Object.keys(byLoan).sort((a,b)=>Number(a)-Number(b)).forEach(lid=>{
        let running=0;
        byLoan[lid].forEach(p=>{running+=p.amount; result.push({payment_id:p.payment_id,loan_id:p.loan_id,amount:p.amount,running_total:running});});
      });
      return result;
    })(),
    hint:'SUM(amount) OVER (PARTITION BY loan_id ORDER BY payment_id) — PARTITION BY resets the running total for each loan.'},

  {id:'q_ll4', level:4, concept:'lag_lead', type:'challenge', ordered:true,
    prompt:'For each payment within each loan (ordered by payment_id), show payment_id, loan_id, amount, the previous payment amount in that loan as prev_amt (NULL if first), and next payment amount as next_amt (NULL if last). Order by loan_id, payment_id.',
    solution:'SELECT payment_id, loan_id, amount, LAG(amount) OVER (PARTITION BY loan_id ORDER BY payment_id) AS prev_amt, LEAD(amount) OVER (PARTITION BY loan_id ORDER BY payment_id) AS next_amt FROM payments ORDER BY loan_id, payment_id',
    expected:(function(){
      const byLoan={};
      [...TABLES.payments].sort((a,b)=>a.payment_id-b.payment_id).forEach(p=>{
        if(!byLoan[p.loan_id]) byLoan[p.loan_id]=[];
        byLoan[p.loan_id].push(p);
      });
      const result=[];
      Object.keys(byLoan).sort((a,b)=>Number(a)-Number(b)).forEach(lid=>{
        const ps=byLoan[lid];
        ps.forEach((p,i)=>{
          result.push({payment_id:p.payment_id,loan_id:p.loan_id,amount:p.amount,prev_amt:i===0?null:ps[i-1].amount,next_amt:i===ps.length-1?null:ps[i+1].amount});
        });
      });
      return result;
    })(),
    hint:'Use both LAG and LEAD with PARTITION BY loan_id ORDER BY payment_id — each resets per loan. Both return NULL at the boundaries.'},

// ─── SESSION LOGIC ───────────────────────────────────────────────────────────

function getTodayString() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function pickQ(level, concept, type, exclude) {
  // Prefer unseen; fall back to any matching question when all are exhausted
  return QUESTIONS.find(q => q.level===level && q.concept===concept && q.type===type && !exclude.includes(q.id))
      || QUESTIONS.find(q => q.level===level && q.concept===concept && q.type===type)
      || null;
}

function generateSession() {
  const level = progress.level;
  const concepts = CURRICULUM[level].concepts;
  const conceptIndex = progress.completedSessions % concepts.length;
  const concept = concepts[conceptIndex];
  const done = progress.completedQuestions;

  const w  = pickQ(level, concept, 'warmup',      done);
  const c  = pickQ(level, concept, 'consolidate', [...done, w?.id]);
  // q3: stretch — fallback to consolidate or warmup if no stretch exists for this concept
  const s  = pickQ(level, concept, 'stretch',     [...done, w?.id, c?.id])
          || pickQ(level, concept, 'consolidate', [...done, w?.id, c?.id])
          || pickQ(level, concept, 'warmup',      [...done, w?.id, c?.id]);
  // q5: challenge — fallback to cross-concept question if no challenge exists for this concept
  const chExclude = [...done, w?.id, c?.id, s?.id].filter(Boolean);
  const ch = pickQ(level, concept, 'challenge', chExclude)
          || QUESTIONS.find(q =>
               q.level === level &&
               q.concept !== concept &&
               !done.includes(q.id) &&
               !chExclude.includes(q.id)
             )
          || QUESTIONS.find(q => q.level === level && q.concept !== concept);

  // Q4: review — first unseen question from another concept at the same level
  const otherConcepts = CURRICULUM[level].concepts.filter(x => x !== concept);
  const usedIds = [w?.id, c?.id, s?.id, ch?.id].filter(Boolean);
  let rev = null;
  for (const oc of otherConcepts) {
    rev = QUESTIONS.find(q => q.level === level && q.concept === oc && !done.includes(q.id) && !usedIds.includes(q.id));
    if (rev) break;
  }
  // fallback: any question from the level that differs from the main concept
  if (!rev) rev = QUESTIONS.find(q => q.level === level && q.concept !== concept);

  const slot = (q, status = 'locked') => ({id: q?.id || null, status, attempts: 0});

  const session = {
    date: getTodayString(),
    conceptIndex,
    concept,
    q1: slot(w,  'pending'),
    q2: slot(c),
    q3: slot(s),
    q4: slot(rev),
    q5: slot(ch),
  };

  progress.currentSession = session;
  progress.lastSessionDate = getTodayString();
  saveProgress(progress);
  return session;
}

function getOrCreateSession() {
  const today = getTodayString();
  // Gate unlock: if the gate was just passed for this session count, allow immediate generation
  if (progress.gateUnlockedSession === progress.completedSessions && progress.currentSession &&
      progress.currentSession.gateUnlocked) {
    return progress.currentSession;
  }
  if (progress.lastSessionDate === today && progress.currentSession) {
    return progress.currentSession;
  }
  return generateSession();
}

function completeSession() {
  const session = progress.currentSession;
  if (!session) return;

  // streak logic — prevent double-counting when bonus session completes same day
  const today = getTodayString();
  const yesterday = (function(){
    const d = new Date();
    d.setDate(d.getDate()-1);
    const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  })();

  if (progress.lastStreakDate !== today) {
    if (progress.lastStreakDate === yesterday) {
      progress.streak += 1;
    } else if (!progress.lastStreakDate) {
      progress.streak = 1;
    } else {
      progress.streak = 1; // streak broken — start fresh at 1 (session just completed)
    }
    progress.lastStreakDate = today;
  }

  // add completed questions
  ['q1','q2','q3','q4','q5'].forEach(k => {
    if (session[k]?.id && !progress.completedQuestions.includes(session[k].id)) {
      progress.completedQuestions.push(session[k].id);
    }
  });

  progress.completedSessions += 1;

  // check level up
  const currentLevel = progress.level;
  let didLevelUp = false;
  if (currentLevel < 5) {
    const concepts = CURRICULUM[currentLevel].concepts;
    const sessionsNeeded = concepts.length;
    if (progress.completedSessions >= sessionsNeeded) {
      const sessionsForLevel = progress.completedSessions % sessionsNeeded === 0 &&
        progress.completedSessions > 0 &&
        CURRICULUM[currentLevel].concepts.every(c =>
          QUESTIONS.some(q => q.concept===c && q.level===currentLevel && progress.completedQuestions.includes(q.id))
        );
      if (sessionsForLevel) {
        progress.level = Math.min(5, currentLevel + 1);
        didLevelUp = true;
      }
    }
  }

  saveProgress(progress);

  // Fire animations after save
  setTimeout(() => {
    animate('session-complete');
    if (didLevelUp) setTimeout(() => animate('level-up', progress.level), 1300);
  }, 50);
}

// ─── DAY GATE ────────────────────────────────────────────────────────────────

// Ephemeral gate state — not persisted; resets on page reload or new session
let gateState = null; // null | { phase: 'prompt'|'questions'|'closed'|'passed', questions: [...], current: 0, attempts: [0,0], passed: [false,false] }

function initGate() {
  const level = progress.level;
  const concepts = CURRICULUM[level].concepts;
  const nextIndex = progress.completedSessions % concepts.length;
  const nextConcept = concepts[nextIndex];

  const pool = QUESTIONS.filter(q =>
    q.level === level &&
    q.concept === nextConcept &&
    q.type === 'gate'
  );

  if (pool.length < 2) return null; // not enough questions — no gate

  const gq1 = pool[0];
  const gq2 = pool.find(q => q.id !== gq1.id) || pool[1];

  return {
    phase: 'prompt',  // 'prompt' | 'questions' | 'closed' | 'passed'
    concept: nextConcept,
    questions: [gq1, gq2],
    current: 0,       // index of active gate question (0 or 1)
    attempts: [0, 0],
    passed: [false, false]
  };
}

function submitGateAnswer(gIdx) {
  if (!gateState || gateState.phase !== 'questions') return;

  const qdef = gateState.questions[gIdx];
  const ta = document.getElementById(`gate-ta-${gIdx}`);
  const fb = document.getElementById(`gate-fb-${gIdx}`);
  const sql = ta ? ta.value.trim() : '';

  if (!sql) {
    fb.className = 'feedback fail show';
    fb.innerHTML = 'Please enter a SQL query.';
    return;
  }

  gateState.attempts[gIdx] += 1;
  const ev = evaluate(qdef, sql);

  if (ev.pass) {
    gateState.passed[gIdx] = true;
    ta.disabled = true;
    ta.className = 'success';
    fb.className = 'feedback pass show';
    fb.innerHTML = `Correct! Your query returned ${ev.result.length} row(s).`;

    if (gIdx === 0 && !gateState.passed[1]) {
      // Advance to gate Q2
      gateState.current = 1;
      renderGate();
      return;
    }

    if (gateState.passed[0] && gateState.passed[1]) {
      // Both passed — unlock next session
      gateState.phase = 'passed';
      progress.gateUnlockedSession = progress.completedSessions;
      const nextSession = generateSession();
      nextSession.gateUnlocked = true;
      progress.currentSession = nextSession;
      saveProgress(progress);
      gateState = null;
      renderToday();
      renderProgress();
      return;
    }
  } else {
    ta.className = 'error';
    fb.className = 'feedback fail show';
    let msg = ev.hint || 'Not quite right.';
    if (gateState.attempts[gIdx] >= 3) {
      // Gate failed
      gateState.phase = 'closed';
      renderGate();
      return;
    }
    fb.innerHTML = `<div>${msg}</div><div class="hint" style="margin-top:6px">Attempts: ${gateState.attempts[gIdx]}/3</div>`;
  }
}

function gateSkip() {
  // User chose "No thanks" — just show the come-back message, no gate
  const container = document.getElementById('gate-container');
  if (!container) return;
  gateState = null;
  container.innerHTML = `<p style="color:var(--text-dim);font-size:14px;margin-top:8px">Come back tomorrow for your next session.</p>`;
}

function gateContinue() {
  // User chose "Continue to next topic?" — advance phase to questions
  if (!gateState) return;
  gateState.phase = 'questions';
  renderGate();
}

function renderGate() {
  const container = document.getElementById('gate-container');
  if (!container) return;
  if (!gateState) { container.innerHTML = ''; return; }

  if (gateState.phase === 'prompt') {
    const conceptLabel = CONCEPT_LABELS[gateState.concept] || gateState.concept;
    container.innerHTML = `<div class="gate-card">
      <div class="gate-header">
        <span class="gate-icon">🔓</span>
        <div>
          <h3>Ready for more?</h3>
          <p style="margin:0;font-size:13px;color:var(--text-dim)">Unlock <strong>${conceptLabel}</strong> right now with 2 quick questions — or come back tomorrow.</p>
        </div>
      </div>
      <div class="gate-actions">
        <button class="btn-continue" onclick="gateContinue()">Continue to next topic?</button>
        <button class="btn-skip" onclick="gateSkip()">No thanks, I'll come back tomorrow</button>
      </div>
    </div>`;
    return;
  }

  if (gateState.phase === 'closed') {
    container.innerHTML = `<div class="gate-card gate-failed">
      <h3>Gate closed</h3>
      <p>Great try! Come back tomorrow to continue.</p>
    </div>`;
    return;
  }

  // phase === 'questions'
  const conceptLabel = CONCEPT_LABELS[gateState.concept] || gateState.concept;
  let html = `<div class="gate-card">
    <div class="gate-header">
      <span class="gate-icon">🔓</span>
      <div>
        <h3>Gate: Unlock tomorrow's topic now?</h3>
        <p style="margin:0;font-size:13px;color:var(--text-dim)">Answer 2 questions on <strong>${conceptLabel}</strong> to start it today.</p>
      </div>
    </div>`;

  [0, 1].forEach(gIdx => {
    if (gIdx > gateState.current) return; // show Q2 only after Q1 answered
    const qdef = gateState.questions[gIdx];
    const isDone = gateState.passed[gIdx];
    html += `<div class="gate-q${isDone ? ' gate-q-done' : ''}">
      <div class="q-header">
        <span class="q-label">Gate Q${gIdx + 1}</span>
        ${isDone ? '<span class="pill pass">✓ Pass</span>' : `<span style="font-size:12px;color:var(--text-dim)">Max 3 attempts</span>`}
      </div>
      <div class="q-prompt">${qdef.prompt}</div>`;

    if (!isDone) {
      html += `<div class="editor-wrap">
        <textarea id="gate-ta-${gIdx}" placeholder="Write your SQL here..." onkeydown="handleTabKey(event)"></textarea>
        <pre class="hl-layer" id="gate-hl-${gIdx}"></pre>
      </div>
      <button class="run-btn" onclick="submitGateAnswer(${gIdx})">▶ Run &amp; Check</button>`;
    } else {
      html += `<div class="editor-wrap">
        <textarea disabled class="success">${qdef.solution}</textarea>
      </div>`;
    }
    html += `<div class="feedback" id="gate-fb-${gIdx}"></div>
    </div>`;
  });

  html += `</div>`;
  container.innerHTML = html;
  initHighlighters();
}

// ─── EVALUATION ENGINE ───────────────────────────────────────────────────────

function setupDB() {
  ['loans','customers','payments','employees','branches','transactions','products'].forEach(t => {
    try { alasql(`DROP TABLE ${t}`); } catch(e) {}
    alasql(`CREATE TABLE ${t}`);
    alasql.tables[t].data = TABLES[t].map(r => Object.assign({}, r));
  });
}

function runQuery(sql) {
  setupDB();
  return alasql(sql);
}

function normalizeVal(v) {
  if (v === null || v === undefined) return null;
  if (typeof v === 'number') return Math.round(v * 10000) / 10000;
  return String(v).trim();
}

function normalizeResult(result) {
  return result.map(row => Object.values(row).map(normalizeVal));
}

function compareResults(actual, expected, ordered) {
  if (actual.length !== expected.length) return false;
  const na = normalizeResult(actual);
  const ne = normalizeResult(expected);
  if (ordered) {
    return JSON.stringify(na) === JSON.stringify(ne);
  }
  const sortFn = (a,b) => JSON.stringify(a).localeCompare(JSON.stringify(b));
  return JSON.stringify([...na].sort(sortFn)) === JSON.stringify([...ne].sort(sortFn));
}

function evaluate(question, userSQL) {
  try {
    if (question.verify) {
      // DML question: run user's statement, then run verify SELECT to check result
      setupDB();
      alasql(userSQL.trim());
      const result = alasql(question.verify);
      const pass = compareResults(result, question.expected, question.ordered || false);
      if (pass) return {pass:true, result};
      let hint = question.hint;
      if (result.length !== question.expected.length) hint = `Verification returned ${result.length} row(s), expected ${question.expected.length}. ` + question.hint;
      return {pass:false, hint, result, got:result.length, expected:question.expected.length};
    }
    const result = runQuery(userSQL.trim());
    const pass = compareResults(result, question.expected, question.ordered || false);
    if (pass) return {pass:true, result};
    let hint = question.hint;
    if (result.length === 0) hint = 'Your query returned no rows. ' + question.hint;
    else if (result.length !== question.expected.length) hint = `Got ${result.length} row(s), expected ${question.expected.length}. ` + question.hint;
    return {pass:false, hint, result, got:result.length, expected:question.expected.length};
  } catch(e) {
    return {pass:false, hint:`SQL error: ${e.message}`, error:true};
  }
}

// ─── RESULT PREVIEW ──────────────────────────────────────────────────────────

function escCell(v) {
  if (v === null || v === undefined) return '<em>null</em>';
  return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function buildResultTable(rows) {
  if (!rows || rows.length === 0) return '<p style="color:var(--text-dim);font-size:13px;">No rows returned.</p>';
  const cols = Object.keys(rows[0]);
  const preview = rows.slice(0,5);
  const more = rows.length > 5 ? rows.length - 5 : 0;
  let html = '<table><thead><tr>' + cols.map(c=>`<th>${escCell(c)}</th>`).join('') + '</tr></thead><tbody>';
  preview.forEach(row => {
    html += '<tr>' + cols.map(c=>`<td>${escCell(row[c])}</td>`).join('') + '</tr>';
  });
  html += '</tbody></table>';
  if (more) html += `<div class="more-rows">+${more} more row(s)</div>`;
  return html;
}

function showSolution(qKey) {
  const session = progress.currentSession;
  const qSlot = session[qKey];
  const qdef = QUESTIONS.find(q => q.id === qSlot.id);
  if (!qdef) return;
  const ta = document.getElementById(`ta-${qKey}`);
  ta.value = qdef.solution;
  ta.className = '';
  const hl = document.getElementById(`hl-${qKey}`);
  if (hl) syncHL(ta, hl);
  const fb = document.getElementById(`fb-${qKey}`);
  fb.className = 'feedback fail show';
  fb.innerHTML = `<div style="color:var(--warning)">Solution revealed — study it, then run it to continue.</div>`;
  document.getElementById(`rp-${qKey}`).className = 'result-preview';
}

// ─── RENDER TODAY TAB ────────────────────────────────────────────────────────

const Q_LABELS = {q1:'Q1 · Warm-up', q2:'Q2 · Consolidate', q3:'Q3 · Stretch', q4:'Q4 · Review', q5:'Q5 · Challenge'};

function renderToday() {
  const session = getOrCreateSession();
  const concept = session.concept;
  const dayNumber = progress.completedSessions + 1;
  const allPass = ['q1','q2','q3','q4','q5'].every(k => !session[k] || !session[k].id || session[k].status === 'pass');

  let html = `<div class="card">
    <div class="session-meta">
      <strong>Day ${dayNumber}</strong>
      <span style="color:var(--text-dim)">·</span>
      <span>Topic: <span class="pill concept">${CONCEPT_LABELS[concept]}</span></span>
    </div>
    <button class="collapsible-btn" onclick="toggleCollapsible('tip')">
      <span><span class="icon">💡</span>Tip — ${CONCEPT_LABELS[concept]}</span>
      <span class="chevron">▼</span>
    </button>
    <div class="collapsible-content" id="coll-tip">${TIPS[concept]}</div>
    <button class="collapsible-btn" onclick="toggleCollapsible('scenario')">
      <span><span class="icon">📊</span>Real-world scenario</span>
      <span class="chevron">▼</span>
    </button>
    <div class="collapsible-content" id="coll-scenario">${SCENARIOS[concept]}</div>
  </div>`;

  if (allPass) {
    html += `<div class="complete-banner">
      <h2>Session complete! 🎉</h2>
      <div class="streak-display">🔥 ${progress.streak}</div>
    </div>
    <div id="gate-container"></div>`;
  }

  ['q1','q2','q3','q4','q5'].forEach((k, idx) => {
    if (!session[k]) return;
    const qdef = QUESTIONS.find(q => q.id === session[k].id);
    if (!qdef) return;
    const slot = session[k];
    const isLocked = slot.status === 'locked';
    const isDone   = slot.status === 'pass';
    const reviewTag = (k === 'q4' && qdef.concept !== concept)
      ? ` · <span style="color:var(--accent2)">${CONCEPT_LABELS[qdef.concept]}</span>` : '';
    html += `<div class="q-card${isLocked?' locked':''}" id="qcard-${k}">
      <div class="q-header">
        <span class="q-label">${Q_LABELS[k]}${reviewTag}</span>
        ${isDone ? '<span class="pill pass">✓ Pass</span>' : isLocked ? `<span class="pill locked">🔒 Complete Q${idx} first</span>` : ''}
      </div>
      <div class="q-prompt">${qdef.prompt}</div>
      <div class="editor-wrap">
        <textarea id="ta-${k}" placeholder="Write your SQL here..." ${isDone||isLocked?'disabled':''}
          onkeydown="handleTabKey(event)">${isDone ? qdef.solution : ''}</textarea>
        <pre class="hl-layer" id="hl-${k}"></pre>
      </div>
      ${!isDone && !isLocked ? `<button class="run-btn" onclick="submitAnswer('${k}')">▶ Run &amp; Check</button>` : ''}
      <div class="feedback" id="fb-${k}"></div>
      <div class="result-preview" id="rp-${k}"></div>
    </div>`;
  });

  document.getElementById('today-content').innerHTML = html;
  updateHeader();
  renderProgress();
  initHighlighters();

  // If session is complete, show the continue prompt (init gate with phase='prompt' if not already set)
  if (allPass) {
    if (!gateState) gateState = initGate();
    if (gateState) renderGate();
  }
}

function toggleCollapsible(id) {
  const btn = document.querySelector(`[onclick="toggleCollapsible('${id}')"]`);
  const content = document.getElementById(`coll-${id}`);
  btn.classList.toggle('open');
  content.classList.toggle('open');
}

function handleTabKey(e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    const ta = e.target;
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    ta.value = ta.value.substring(0, start) + '  ' + ta.value.substring(end);
    ta.selectionStart = ta.selectionEnd = start + 2;
  }
}

const NEXT_Q = {q1:'q2', q2:'q3', q3:'q4', q4:'q5'};

function submitAnswer(qKey) {
  const session = progress.currentSession;
  const qSlot = session[qKey];
  const qdef = QUESTIONS.find(q => q.id === qSlot.id);
  if (!qdef) return;

  const ta = document.getElementById(`ta-${qKey}`);
  const fb = document.getElementById(`fb-${qKey}`);
  const rp = document.getElementById(`rp-${qKey}`);
  const sql = ta.value.trim();

  if (!sql) {
    fb.className = 'feedback fail show';
    fb.innerHTML = 'Please enter a SQL query.';
    return;
  }

  qSlot.attempts += 1;
  const ev = evaluate(qdef, sql);

  if (ev.pass) {
    qSlot.status = 'pass';
    ta.className = 'success';
    ta.disabled = true;
    const hl = document.getElementById(`hl-${qKey}`);
    if (hl) syncHL(ta, hl);

    fb.className = 'feedback pass show';
    fb.innerHTML = `Correct! Your query returned ${ev.result.length} row(s).`;
    rp.className = 'result-preview show';
    rp.innerHTML = buildResultTable(ev.result);
    animate('correct-pulse', document.getElementById(`qcard-${qKey}`));

    const nextKey = NEXT_Q[qKey];
    if (nextKey && session[nextKey]) session[nextKey].status = 'pending';

    const allDone = ['q1','q2','q3','q4','q5'].every(k => !session[k] || !session[k].id || session[k].status === 'pass');
    if (allDone) completeSession();

    saveProgress(progress);
    setTimeout(() => {
      renderToday();
      document.getElementById(`fb-${qKey}`)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 400);
  } else {
    ta.className = 'error';
    fb.className = 'feedback fail show';
    animate('shake', document.getElementById(`qcard-${qKey}`));
    let msg = ev.hint || 'Not quite right.';
    const solutionBtn = qSlot.attempts >= 3
      ? `<button onclick="showSolution('${qKey}')" style="display:block;margin-top:10px;background:none;border:1px solid var(--warning);color:var(--warning);border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer;font-weight:600">Show Solution</button>`
      : '';
    fb.innerHTML = `<div>${msg}</div><div class="hint" style="margin-top:6px">Attempts: ${qSlot.attempts}</div>${solutionBtn}`;
    if (!ev.error) {
      rp.className = 'result-preview show';
      const yourRows = ev.result || [];
      rp.innerHTML =
        `<div style="font-size:11px;color:var(--error);font-weight:700;margin-bottom:4px">YOUR RESULT (${yourRows.length} row${yourRows.length !== 1 ? 's' : ''})</div>` +
        buildResultTable(yourRows) +
        `<div style="font-size:11px;color:var(--accent);font-weight:700;margin:10px 0 4px">EXPECTED (${qdef.expected.length} row${qdef.expected.length !== 1 ? 's' : ''})</div>` +
        buildResultTable(qdef.expected);
    } else {
      rp.className = 'result-preview';
    }
    saveProgress(progress);
    document.getElementById(`fb-${qKey}`)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

// ─── WIKI ────────────────────────────────────────────────────────────────────

function renderWiki() {
  document.getElementById('wiki-content').innerHTML = buildWikiHTML();
}

function toggleWikiCard(el) {
  el.classList.toggle('open');
}

function filterWiki(q) {
  const term = q.toLowerCase();
  document.querySelectorAll('.ref-card').forEach(card => {
    const hidden = term.length > 0 && !card.dataset.search.includes(term);
    card.classList.toggle('hidden', hidden);
    if (term.length > 0 && !hidden) {
      card.classList.add('open');
    } else if (term.length === 0) {
      card.classList.remove('open');
    }
  });
  document.querySelectorAll('.ref-level-header').forEach(h => {
    const allHidden = [...h.parentElement.querySelectorAll('.ref-card')].filter(c => {
      let el = c.previousElementSibling;
      while (el && !el.classList.contains('ref-level-header')) el = el.previousElementSibling;
      return el === h;
    }).every(c => c.classList.contains('hidden'));
    h.style.display = allHidden ? 'none' : '';
  });
}

function buildWikiHTML() {
  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function code(s) {
    return `<pre class="ref-code">${esc(s)}</pre>`;
  }
  function card(label, lvl, desc, syntax, example, tipText) {
    const search = (label + ' ' + desc + ' ' + syntax + ' ' + example).toLowerCase();
    return `<div class="card ref-card" data-search="${esc(search)}" onclick="toggleWikiCard(this)">
      <div class="ref-card-trigger">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="ref-card-label" style="font-size:15px;font-weight:700;color:var(--text)">${label}</span>
          <span class="concept-level-pill lvl-${lvl}">Lvl ${lvl}</span>
        </div>
        <span class="ref-card-chevron">▼</span>
      </div>
      <div class="ref-card-body">
        <p style="font-size:13px;color:var(--text-dim);line-height:1.6;margin-bottom:8px">${desc}</p>
        <div class="ref-label">Syntax</div>${code(syntax)}
        <div class="ref-label">Example</div>${code(example)}
        <div class="ref-tip">💡 ${tipText}</div>
      </div>
    </div>`;
  }
  function lvlHeader(lvl, name) {
    return `<div class="ref-level-header">Level ${lvl} — ${name}</div>`;
  }

  return `<input class="wiki-search" type="text" placeholder="🔍  Search concepts, keywords..." oninput="filterWiki(this.value)">` +

  lvlHeader(1, 'Foundations') +

  card('SELECT', 1,
    'Specifies which columns to return from a table. The foundation of every query.',
    `SELECT col1, col2      -- specific columns
SELECT *               -- all columns
SELECT col AS alias    -- rename a column in the result`,
    `SELECT loan_id, amount, status
FROM loans`,
    'Column order in the result follows your SELECT list, not the table definition. Always prefer naming columns over <code>SELECT *</code> in production.'
  ) +

  card('WHERE', 1,
    'Filters rows before they are returned. Only rows where the condition is TRUE are included.',
    `SELECT ...
FROM table
WHERE column = 'value'
WHERE column > 100
WHERE column IS NULL`,
    `SELECT *
FROM loans
WHERE status = 'active'`,
    'String values use single quotes. WHERE runs <em>before</em> any grouping or aggregation — it operates on raw rows, not computed values.'
  ) +

  card('AND / OR', 1,
    'Combines multiple conditions in WHERE. AND requires both to be true; OR requires either.',
    `WHERE cond1 AND cond2          -- both must be true
WHERE cond1 OR cond2           -- either must be true
WHERE (cond1 OR cond2) AND cond3  -- parentheses control precedence`,
    `SELECT *
FROM loans
WHERE status = 'active'
  AND amount > 8000`,
    'AND has higher precedence than OR — it binds tighter. Always use parentheses when mixing both to make intent explicit and avoid subtle bugs.'
  ) +

  card('ORDER BY', 1,
    'Sorts the result set. Without ORDER BY, row order is unpredictable and should never be relied on.',
    `SELECT ...
FROM table
ORDER BY col DESC       -- largest / latest first
ORDER BY col ASC        -- smallest / earliest (default)
ORDER BY col1, col2     -- sort by multiple columns`,
    `SELECT *
FROM customers
ORDER BY credit_score DESC`,
    'ASC is the default — you can omit it. Always pair ORDER BY with LIMIT; without it, LIMIT picks rows in an arbitrary order that can change between runs.'
  ) +

  card('DISTINCT', 1,
    'Removes duplicate rows from the result. Applies to the full set of selected columns.',
    `SELECT DISTINCT col FROM table
SELECT DISTINCT col1, col2 FROM table`,
    `SELECT DISTINCT city
FROM customers`,
    'DISTINCT acts on the whole row — if you select two columns, a row is a duplicate only when <em>both</em> columns are identical. Selecting more columns means fewer duplicates are removed.'
  ) +

  card('LIMIT', 1,
    'Caps the number of rows returned. Essential for top-N queries and pagination.',
    `SELECT ...
FROM table
ORDER BY col DESC
LIMIT n`,
    `SELECT *
FROM loans
ORDER BY amount DESC
LIMIT 3`,
    'Always pair LIMIT with ORDER BY. Without ORDER BY, the database picks rows in an arbitrary order — you may get different results on every run.'
  ) +

  lvlHeader(2, 'Aggregation') +

  card('Aggregate Functions', 2,
    'Collapse many rows into a single value. Used for counts, sums, averages, and ranges.',
    `COUNT(*)          -- count all rows (including NULLs)
COUNT(col)        -- count non-NULL values only
SUM(col)          -- total
AVG(col)          -- mean
MIN(col)          -- smallest value
MAX(col)          -- largest value`,
    `SELECT COUNT(*) AS loan_count,
       SUM(amount)  AS total,
       AVG(amount)  AS average,
       MAX(amount)  AS largest
FROM loans`,
    'COUNT(*) counts every row. COUNT(col) skips NULLs — the difference matters when a column has missing values. SUM, AVG, MIN, MAX all ignore NULLs automatically.'
  ) +

  card('GROUP BY', 2,
    'Groups rows with the same value and collapses each group using aggregate functions.',
    `SELECT col, COUNT(*) AS cnt
FROM table
GROUP BY col

SELECT col1, col2, SUM(val)
FROM table
GROUP BY col1, col2`,
    `SELECT status, COUNT(*) AS loan_count
FROM loans
GROUP BY status`,
    'Every column in SELECT must either appear in GROUP BY or be wrapped in an aggregate function (COUNT, SUM, etc.). Mixing plain columns with aggregates without GROUP BY is an error.'
  ) +

  card('HAVING', 2,
    'Filters groups after GROUP BY — the aggregate equivalent of WHERE.',
    `SELECT col, COUNT(*) AS cnt
FROM table
GROUP BY col
HAVING COUNT(*) > 1

HAVING AVG(col) > 500`,
    `SELECT city, AVG(credit_score) AS avg_credit
FROM customers
GROUP BY city
HAVING AVG(credit_score) > 700`,
    'WHERE runs before grouping (filters raw rows). HAVING runs after grouping (filters groups). You cannot reference aggregate results like COUNT or SUM in a WHERE clause.'
  ) +

  card('CASE WHEN', 2,
    'Returns a value per row based on conditions — a row-level if/else expression.',
    `CASE
  WHEN condition1 THEN value1
  WHEN condition2 THEN value2
  ELSE default_value
END AS alias`,
    `SELECT loan_id,
  CASE
    WHEN interest_rate > 8  THEN 'high risk'
    WHEN interest_rate > 6  THEN 'medium risk'
    ELSE 'standard'
  END AS risk_label
FROM loans`,
    'Conditions are evaluated in order — the first match wins. Always close with END. The ELSE clause is optional but recommended: without it, unmatched rows return NULL.'
  ) +

  lvlHeader(3, 'Joins & Subqueries') +

  card('INNER JOIN', 3,
    'Combines rows from two tables where the join condition matches in both. Non-matching rows are dropped.',
    `SELECT a.col, b.col
FROM table_a a
JOIN table_b b ON a.key = b.key

-- Chain multiple joins:
FROM a JOIN b ON ... JOIN c ON ...`,
    `SELECT c.name, l.amount, l.status
FROM loans l
JOIN customers c ON l.customer_id = c.customer_id`,
    'JOIN is INNER JOIN — rows with no match in either table are silently excluded. If you expect rows to always have a match but they disappear, check for mismatched keys or NULLs.'
  ) +

  card('LEFT JOIN', 3,
    'Keeps ALL rows from the left table. Right-table columns are NULL where there is no match.',
    `SELECT a.col, b.col
FROM table_a a
LEFT JOIN table_b b ON a.key = b.key
-- b columns are NULL when no match`,
    `SELECT c.name, COUNT(l.loan_id) AS loan_count
FROM customers c
LEFT JOIN loans l ON c.customer_id = l.customer_id
GROUP BY c.name`,
    'Use COUNT(right_table.column) not COUNT(*) when you want 0 for unmatched rows. COUNT(*) returns 1 for NULL rows (the left row still exists). To find unmatched rows: WHERE right_table.key IS NULL.'
  ) +

  card('Subquery', 3,
    'A SELECT nested inside another query, wrapped in parentheses. The inner query runs first.',
    `-- Scalar (returns one value):
WHERE col > (SELECT AVG(col) FROM table)

-- List (returns a column of values):
WHERE col IN (SELECT col FROM table WHERE ...)

-- Derived table (inline table):
FROM (SELECT ... FROM table) AS alias`,
    `SELECT *
FROM loans
WHERE amount > (SELECT AVG(amount) FROM loans)`,

WHERE EXISTS (

FROM customers
WHERE customer_id IN (

  card('CTE (WITH)', 4,
    'Names a subquery at the top of your statement so you can reference it like a table.',

  SELECT ...
  FROM table
  WHERE ...

FROM cte_name
WHERE ...

-- Chain multiple CTEs:

SELECT * FROM b`,

  card('ROW_NUMBER()', 4,
    'Assigns a unique sequential integer to each row within a partition. No ties — every row gets a distinct number.',
    `ROW_NUMBER() OVER (
  ORDER BY col DESC
) AS row_num

-- Reset per group with PARTITION BY:
ROW_NUMBER() OVER (
  PARTITION BY group_col
  ORDER BY col DESC

    'Like ROW_NUMBER but handles ties. RANK skips numbers after ties; DENSE_RANK never skips.',

DENSE_RANK() OVER (ORDER BY col DESC) AS drnk
-- Ties: 1, 1, 2, 3  (no skips)

ROW_NUMBER() OVER (ORDER BY col DESC) AS rn
-- Always unique: 1, 2, 3, 4`,

  DENSE_RANK() OVER (ORDER BY credit_score DESC) AS dense_rnk
FROM customers`,

  ORDER BY col2
) AS running_total

-- Reset per group:

    'Fetches a value from a previous (LAG) or subsequent (LEAD) row within the ordered partition.',

-- Optional: offset (default 1) and default for boundary NULLs:

  card('BETWEEN', 1,

WHERE amount BETWEEN 5000 AND 15000
WHERE hire_year BETWEEN 2018 AND 2021`,

WHERE amount BETWEEN 5000 AND 15000`,

    'Pattern matching for strings. % matches any sequence of characters; _ matches exactly one character.',

WHERE col LIKE '_ang%'     -- second char is a, etc.`,

-- Wrong (always false):

  card('INSERT INTO', 1,

-- Insert from query:

    'Modifies existing rows. Without a WHERE clause, ALL rows in the table are updated.',

SET col1 = value1,
    col2 = value2

-- Update with arithmetic:

WHERE department = 'Sales';`,

  card('DELETE', 1,

-- Delete all rows (keeps table structure):

-- TRUNCATE (faster bulk delete, not in all DBs):

WHERE status = 'closed'

  lvlHeader(1, 'DDL — Data Definition') +

  card('CREATE TABLE', 1,

);

-- Common data types:
-- INT, BIGINT         → whole numbers
-- DECIMAL(p,s)        → fixed precision
-- VARCHAR(n), TEXT    → variable text
-- DATE, DATETIME      → dates/timestamps
-- BOOLEAN             → true/false`,

  card('ALTER TABLE', 1,
    'Modifies an existing table structure: add/drop/modify columns or add/drop constraints.',

-- Drop a column:

-- Rename a column (SQL Server / PG):

-- Add a constraint:

-- DROP vs TRUNCATE vs DELETE:

  card('NOT NULL & UNIQUE', 2,

-- Add to existing table:

ALTER TABLE t MODIFY col1 VARCHAR(50) NOT NULL;`,

);`,

  card('PRIMARY KEY & FOREIGN KEY', 2,

  card('CHECK & DEFAULT', 2,

  lvlHeader(2, 'Views') +

  card('NULLIF', 4,
