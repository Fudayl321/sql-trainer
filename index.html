  lvlHeader(4, 'Aliases & Date Functions') +

  card('Aliases (AS)', 4,
    'Gives a column or table expression a temporary name used only in the output. Column aliases appear in the result header; table aliases shorten join syntax.',
    `-- Column alias:
SELECT col AS alias_name FROM table;
SELECT col alias_name FROM table;   -- AS is optional

-- Table alias (required for self-joins):
SELECT a.col, b.col
FROM table AS a
JOIN table AS b ON a.key = b.key;

-- Alias computed expressions:
SELECT amount * 1.1 AS amount_with_tax,
       UPPER(name) AS name_upper
FROM table;`,
    `SELECT loan_id      AS id,
       amount        AS loan_amount,
       amount * 0.07 AS interest
FROM loans AS l
JOIN customers AS c ON l.customer_id = c.customer_id;`,
    'Column aliases defined in SELECT cannot be used in WHERE, GROUP BY, or HAVING in most databases (they have not been computed yet). Use the alias only in ORDER BY or in an outer query. Table aliases are visible throughout the entire query.'
  ) +

  card('Date Functions', 4,
    'Built-in functions for working with date and time values. Names differ between databases but concepts are universal.',
    `-- Get current date / timestamp:
CURRENT_DATE          -- standard SQL
CURRENT_TIMESTAMP     -- date + time, standard SQL
NOW()                 -- MySQL / PostgreSQL
GETDATE()             -- SQL Server

-- Extract parts:
YEAR(col)             -- MySQL / SQL Server
MONTH(col)
DAY(col)
EXTRACT(YEAR FROM col)   -- standard SQL

-- Date arithmetic:
DATEDIFF(end, start)     -- MySQL: days between
DATEADD(day, n, col)     -- SQL Server: add n days
col + INTERVAL '1 month' -- PostgreSQL / MySQL`,
    `-- Loans created in the last 30 days:
SELECT *
FROM loans
WHERE created_at >= CURRENT_DATE - INTERVAL '30' DAY;

-- Extract year from date:
SELECT YEAR(created_at) AS year, COUNT(*) AS cnt
FROM loans
GROUP BY YEAR(created_at);`,
    'Date functions are the most database-specific part of SQL. When writing cross-database code, use CURRENT_DATE and CURRENT_TIMESTAMP (ANSI standard) and EXTRACT() for parsing. For date arithmetic, check the target database\'s syntax — it varies significantly.'
  );
}

// ─── PRACTICE MODE ───────────────────────────────────────────────────────────

const practiceState = { concept: null, qIndex: 0 };

function renderPractice() {
  document.getElementById('practice-content').innerHTML = buildPracticeHTML();
  initHighlighters();
}

function buildPracticeHTML() {
  if (!practiceState.concept) {
    let html = '<div class="card"><div class="section-title">Choose a Concept</div>';
    [1,2,3,4,5].forEach(lvl => {
      html += `<div style="margin-bottom:14px">
        <div style="font-size:12px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px">Lvl ${lvl} — ${CURRICULUM[lvl].name}</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px">`;
      CURRICULUM[lvl].concepts.forEach(c => {
        html += `<button onclick="selectPracticeConcept('${c}')" style="background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer">${CONCEPT_LABELS[c]}</button>`;
      });
      html += '</div></div>';
    });
    html += '</div>';
    return html;
  }

  const concept = practiceState.concept;
  const qs = QUESTIONS.filter(q => q.concept === concept);
  const idx = practiceState.qIndex % qs.length;
  const qdef = qs[idx];

  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <button onclick="selectPracticeConcept(null)" style="background:none;border:none;color:var(--accent);font-size:13px;cursor:pointer">← Back</button>
      <span class="pill concept">${CONCEPT_LABELS[concept]}</span>
      <span style="font-size:12px;color:var(--text-dim)">${idx + 1} / ${qs.length}</span>
    </div>
    <div class="card">
      <div class="q-prompt" style="margin-bottom:12px">${qdef.prompt}</div>
      <div class="editor-wrap">
        <textarea id="ta-practice" placeholder="Write your SQL here..." onkeydown="handleTabKey(event)"></textarea>
        <pre class="hl-layer" id="hl-practice"></pre>
      </div>
      <button class="run-btn" onclick="submitPractice('${qdef.id}')">▶ Run &amp; Check</button>
      <div class="feedback" id="fb-practice"></div>
      <div class="result-preview" id="rp-practice"></div>
    </div>
    ${qs.length > 1 ? `<div style="display:flex;gap:8px">
      <button onclick="shiftPracticeQ(-1)" style="flex:1;padding:12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;font-weight:600;cursor:pointer">← Prev</button>
      <button onclick="shiftPracticeQ(1)" style="flex:1;padding:12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;font-weight:600;cursor:pointer">Next →</button>
    </div>` : ''}`;
}

function selectPracticeConcept(concept) {
  practiceState.concept = concept;
  practiceState.qIndex = 0;
  renderPractice();
}

function shiftPracticeQ(dir) {
  const qs = QUESTIONS.filter(q => q.concept === practiceState.concept);
  practiceState.qIndex = ((practiceState.qIndex + dir) + qs.length) % qs.length;
  renderPractice();
}

function submitPractice(qId) {
  const qdef = QUESTIONS.find(q => q.id === qId);
  if (!qdef) return;
  const ta = document.getElementById('ta-practice');
  const fb = document.getElementById('fb-practice');
  const rp = document.getElementById('rp-practice');
  const sql = ta.value.trim();
  if (!sql) { fb.className = 'feedback fail show'; fb.innerHTML = 'Enter a SQL query.'; return; }

  const ev = evaluate(qdef, sql);
  if (ev.pass) {
    ta.className = 'success';
    fb.className = 'feedback pass show';
    fb.innerHTML = `Correct! (${ev.result.length} row${ev.result.length !== 1 ? 's' : ''})`;
    rp.className = 'result-preview show';
    rp.innerHTML = buildResultTable(ev.result);
  } else {
    ta.className = 'error';
    fb.className = 'feedback fail show';
    const msg = ev.hint || 'Not quite right.';
    fb.innerHTML = `<div>${msg}</div>
      <button onclick="showPracticeSolution('${qId}')" style="display:block;margin-top:10px;background:none;border:1px solid var(--warning);color:var(--warning);border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer;font-weight:600">Show Solution</button>`;
    if (!ev.error) {
      rp.className = 'result-preview show';
      const yourRows = ev.result || [];
      rp.innerHTML =
        `<div style="font-size:11px;color:var(--error);font-weight:700;margin-bottom:4px">YOUR RESULT (${yourRows.length} row${yourRows.length !== 1 ? 's' : ''})</div>` +
        buildResultTable(yourRows) +
        `<div style="font-size:11px;color:var(--accent);font-weight:700;margin:10px 0 4px">EXPECTED (${qdef.expected.length} row${qdef.expected.length !== 1 ? 's' : ''})</div>` +
        buildResultTable(qdef.expected);
    } else {
      rp.className = 'result-preview';
    }
  }
}

function showPracticeSolution(qId) {
  const qdef = QUESTIONS.find(q => q.id === qId);
  if (!qdef) return;
  const ta = document.getElementById('ta-practice');
  ta.value = qdef.solution;
  ta.className = '';
  const fb = document.getElementById('fb-practice');
  fb.className = 'feedback fail show';
  fb.innerHTML = `<div style="color:var(--warning)">Solution revealed — study it, then run it.</div>`;
  document.getElementById('rp-practice').className = 'result-preview';
}

// ─── RENDER PROGRESS TAB ─────────────────────────────────────────────────────

function renderProgress() {
  const level = progress.level;
  const lvlName = CURRICULUM[level].name;
  const concepts = CURRICULUM[level].concepts;
  const sessionsNeeded = concepts.length;
  const sessForThisLevel = progress.completedSessions % sessionsNeeded;
  const pct = Math.round((sessForThisLevel / sessionsNeeded) * 100);

  document.getElementById('prog-level').textContent = `${level} — ${lvlName}`;
  document.getElementById('prog-streak').textContent = progress.streak;
  document.getElementById('prog-sessions').textContent = progress.completedSessions;
  document.getElementById('prog-pct').textContent = `${pct}%`;

  // Segmented XP bar — one segment per concept in current level
  const xpWrap = document.getElementById('xp-bar-wrap');
  if (xpWrap) {
    xpWrap.innerHTML = concepts.map((c, i) => {
      const done = QUESTIONS.filter(q => q.concept === c).some(q => progress.completedQuestions.includes(q.id));
      return `<div class="xp-segment lvl-${level}${done ? ' filled' : ''}"></div>`;
    }).join('');
  }

  // Concept list — all concepts across all levels
  let html = '';
  [1,2,3,4,5].forEach(lvl => {
    CURRICULUM[lvl].concepts.forEach(concept => {
      const conceptQs = QUESTIONS.filter(q=>q.concept===concept);
      const done = conceptQs.some(q=>progress.completedQuestions.includes(q.id));
      html += `<li class="concept-item">
        <span>${CONCEPT_LABELS[concept]}</span>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="concept-level-pill lvl-${lvl}">Lvl ${lvl}</span>
          <span class="concept-check ${done?'done':'pending'}">${done?'✓':'○'}</span>
        </div>
      </li>`;
    });
  });
  document.getElementById('concept-list').innerHTML = html;

  // Streak milestone toast
  const today = getTodayString();
  const streakAlive = progress.lastStreakDate === today;
  if (streakAlive) animate('streak-toast', progress.streak);
}

// ─── RENDER SCHEMA TAB ───────────────────────────────────────────────────────

function renderSchema() {
  const tableNames = Object.keys(TABLES);
  let html = '';
  tableNames.forEach(tname => {
    const rows = TABLES[tname];
    const cols = Object.keys(rows[0]);
    html += `<div class="table-name">${tname}</div>`;
    html += '<div class="schema-table-wrap"><table class="schema-table"><thead><tr>';
    cols.forEach(c => { html += `<th>${c}</th>`; });
    html += '</tr></thead><tbody>';
    rows.slice(0,3).forEach(row => {
      html += '<tr>' + cols.map(c=>`<td>${row[c]}</td>`).join('') + '</tr>';
    });
    html += `</tbody></table></div>`;
    if (rows.length > 3) {
      html += `<div style="font-size:11px;color:var(--text-dim);margin-bottom:4px;text-align:right">+${rows.length-3} more rows</div>`;
    }
  });
  document.getElementById('schema-content').innerHTML = html;
}

// ─── HEADER ──────────────────────────────────────────────────────────────────

function updateHeader() {
  const lvlEl = document.getElementById('hdr-level');
  lvlEl.textContent = `Lvl ${progress.level} · ${CURRICULUM[progress.level].name}`;
  lvlEl.className = `badge level lvl-${progress.level}`;

  const today = getTodayString();
  const yesterday = (function(){
    const d = new Date(); d.setDate(d.getDate()-1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  })();
  const streakAlive = progress.lastStreakDate === today || progress.lastStreakDate === yesterday;
  const displayStreak = streakAlive ? progress.streak : 0;
  const streakEl = document.getElementById('hdr-streak');
  streakEl.textContent = `🔥 ${displayStreak}`;
  if (displayStreak >= 3) streakEl.classList.add('streak-glow');
  else streakEl.classList.remove('streak-glow');
}

// ─── TAB SWITCHING ───────────────────────────────────────────────────────────

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`tab-${name}`).classList.add('active');
  document.getElementById(`nav-${name}`).classList.add('active');

  if (name === 'progress') renderProgress();
  if (name === 'schema') renderSchema();
  if (name === 'today') renderToday();
  if (name === 'practice') renderPractice();
  if (name === 'wiki') renderWiki();
}

// ─── RESET ───────────────────────────────────────────────────────────────────

document.getElementById('reset-btn').addEventListener('click', () => {
  if (window.confirm('Reset all progress? This cannot be undone.')) {
    localStorage.removeItem(STORAGE_KEY);
    progress = Object.assign({}, DEFAULT_PROGRESS);
    renderToday();
    renderProgress();
    updateHeader();
    switchTab('today');
  }
});

// ─── SQL HIGHLIGHTING ────────────────────────────────────────────────────────

const SQL_KW = /\b(SELECT|FROM|WHERE|AND|OR|NOT|AS|ON|JOIN|LEFT|RIGHT|INNER|OUTER|FULL|CROSS|GROUP\s+BY|ORDER\s+BY|HAVING|LIMIT|OFFSET|DISTINCT|UNION|ALL|INSERT|UPDATE|DELETE|SET|INTO|VALUES|CREATE|DROP|TABLE|WITH|PARTITION\s+BY|OVER|CASE|WHEN|THEN|ELSE|END|IN|EXISTS|BETWEEN|LIKE|IS|NULL|ASC|DESC|BY)\b/gi;
const SQL_FN = /\b(COUNT|SUM|AVG|MIN|MAX|ROW_NUMBER|RANK|DENSE_RANK|LAG|LEAD|NTILE|FIRST_VALUE|LAST_VALUE|COALESCE|NULLIF|CAST|CONVERT|ROUND|ABS|UPPER|LOWER|TRIM|LENGTH|SUBSTR|SUBSTRING|CONCAT|REPLACE|ISNULL|NVL)\s*(?=\()/gi;

function highlightSQL(text) {
  const escaped = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  return escaped
    .replace(/('(?:[^'\\]|\\.)*')/g, '<span class="str">$1</span>')
    .replace(SQL_FN, m => `<span class="fn">${m}</span>`)
    .replace(SQL_KW, m => `<span class="kw">${m}</span>`)
    .replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="num">$1</span>');
}

function syncHL(ta, hl) {
  hl.innerHTML = highlightSQL(ta.value) + '\n';
  hl.scrollTop = ta.scrollTop;
  hl.scrollLeft = ta.scrollLeft;
}

function initHighlighters() {
  document.querySelectorAll('.editor-wrap').forEach(wrap => {
    const ta = wrap.querySelector('textarea');
    const hl = wrap.querySelector('.hl-layer');
    if (!ta || !hl) return;
    syncHL(ta, hl);
    ta.addEventListener('input', () => syncHL(ta, hl));
    ta.addEventListener('scroll', () => { hl.scrollTop = ta.scrollTop; });
  });
}

// ─── USERNAME MODAL ──────────────────────────────────────────────────────────

function showUsernameModal() {
  const modal = document.getElementById('username-modal');
  modal.style.display = 'flex';
  const input = document.getElementById('username-input');
  const btn = document.getElementById('username-submit');
  input.addEventListener('input', () => {
    btn.disabled = input.value.trim().length < 3;
  });
  btn.addEventListener('click', () => {
    const val = input.value.trim();
    if (val.length < 3) return;
    localStorage.setItem(USER_ID_KEY, val);
    modal.style.display = 'none';
    initApp();
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !btn.disabled) btn.click();
  });
  setTimeout(() => input.focus(), 50);
}

function showSyncPill(state) {
  const pill = document.getElementById('sync-pill');
  if (!pill) return;
  pill.className = state;
  pill.textContent = state === 'saving' ? '↑ Saving' : '⚠ Offline';
}

function hideSyncPill() {
  const pill = document.getElementById('sync-pill');
  if (!pill) return;
  setTimeout(() => { pill.className = ''; pill.textContent = ''; }, 1500);
}

// ─── INIT ────────────────────────────────────────────────────────────────────

async function initApp() {
  const userId = localStorage.getItem(USER_ID_KEY);
  if (!userId) {
    showUsernameModal();
    return; // modal submit calls initApp() again after saving username
  }
  progress = await loadProgress();
  updateHeader();
  renderProgress();
  renderToday();
}

initApp();

// ─── SERVICE WORKER ──────────────────────────────────────────────────────────

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => {
      console.warn('SW registration failed:', err);
    });
  });
}

// ─── ANIMATION LAYER ─────────────────────────────────────────────────────────

const _shownToasts = new Set(JSON.parse(localStorage.getItem('shown-toasts') || '[]'));

function animate(type, arg) {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  if (type === 'correct-pulse' && arg) {
    arg.style.animation = 'none';
    arg.offsetHeight; // reflow
    arg.style.animation = 'correct-pulse 0.6s ease forwards';
    setTimeout(() => { if (arg) arg.style.animation = ''; }, 650);
  }

  if (type === 'shake' && arg) {
    arg.style.animation = 'none';
    arg.offsetHeight;
    arg.style.animation = 'shake 0.3s ease';
    setTimeout(() => { if (arg) arg.style.animation = ''; }, 350);
  }

  if (type === 'session-complete') {
    const overlay = document.createElement('div');
    overlay.id = 'session-overlay';
    overlay.innerHTML = `<div class="overlay-content">
      <div class="overlay-title">Session Complete!</div>
      <div class="overlay-sub">Concept complete · Keep the streak going 🔥</div>
    </div>`;
    document.body.appendChild(overlay);
    setTimeout(() => overlay.remove(), 1250);
  }

  if (type === 'level-up' && arg) {
    const newLevel = arg;
    const levelNames = { 1:'Foundations', 2:'Aggregation', 3:'Joins & Subqueries', 4:'CTEs & Windows', 5:'DML & Data Changes' };
    const colors = { 1:'#00d4ff', 2:'#7c3aed', 3:'#22c55e', 4:'#f59e0b', 5:'#ef4444' };
    const modal = document.createElement('div');
    modal.id = 'levelup-modal';
    modal.innerHTML = `<div class="modal-box" style="border: 2px solid ${colors[newLevel]}; box-shadow: 0 0 24px ${colors[newLevel]}44;">
      <div class="modal-title" style="color:${colors[newLevel]}">Level Up! 🎉</div>
      <div class="modal-level">Level ${newLevel} · ${levelNames[newLevel] || ''}</div>
      <button class="modal-close" onclick="document.getElementById('levelup-modal').remove()">Let's Go!</button>
    </div>`;
    document.body.appendChild(modal);
  }

  if (type === 'streak-toast' && arg) {
    const streak = arg;
    const milestones = [3, 7, 14];
    const key = `streak-${streak}`;
    if (!milestones.includes(streak) || _shownToasts.has(key)) return;
    _shownToasts.add(key);
    localStorage.setItem('shown-toasts', JSON.stringify([..._shownToasts]));
    const toast = document.createElement('div');
    toast.id = 'streak-toast';
    toast.textContent = `🔥 ${streak}-day streak!`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }
}

// ─── PWA INSTALL BANNER ──────────────────────────────────────────────────────

let _installPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _installPrompt = e;
  if (!localStorage.getItem('pwa-dismissed')) showInstallBanner();
});

function showInstallBanner() {
  if (document.getElementById('pwa-banner')) return;
  const banner = document.createElement('div');
  banner.id = 'pwa-banner';
  banner.innerHTML = `
    <span>📱 Install SQL Trainer as an app</span>
    <div style="display:flex;gap:6px;align-items:center">
      <button onclick="triggerInstall()">Install</button>
      <button class="pwa-dismiss" onclick="dismissInstallBanner()" aria-label="Dismiss">×</button>
    </div>`;
  const main = document.getElementById('main');
  main.insertBefore(banner, main.firstChild);
}

function triggerInstall() {
  if (!_installPrompt) return;
  _installPrompt.prompt();
  _installPrompt.userChoice.then(() => { _installPrompt = null; });
  dismissInstallBanner();
}

function dismissInstallBanner() {
  localStorage.setItem('pwa-dismissed', '1');
  const b = document.getElementById('pwa-banner');
  if (b) b.remove();
}

// ─── OFFLINE INDICATOR ───────────────────────────────────────────────────────

function updateOnlineStatus() {
  const existing = document.getElementById('offline-pill');
  if (!navigator.onLine) {
    if (!existing) {
      const pill = document.createElement('span');
      pill.id = 'offline-pill';
      pill.textContent = 'Offline';
      document.querySelector('#header .badges').appendChild(pill);
    }
  } else {
    if (existing) existing.remove();
  }
}

window.addEventListener('online',  updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();
</script>
